<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Род Шевелевичей-Тихоновичей</title>
<meta name="description" content="Семейное древо. Введи номер предка, чтобы открыть его карточку.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pochaevsk&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f4efe4; --paper:#fbf8f1; --ink:#2a2620; --muted:#7a705f; --rule:#ddd3bf;
  --shev:#2f4f7a; --stem:#9a4a24; --pior:#3f6b45; --spouse:#7a705f; --lav:#7a4a7a;
  --doc:#2f7a4f; --oral:#b07a12; --hyp:#6a5aa8; --conf:#b23a3a;
  --accent:#8a5a1c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1814; --paper:#24211b; --ink:#ece4d4; --muted:#a39780; --rule:#3a352b;
  --shev:#7ea3d6; --stem:#e08a5e; --pior:#86c08e; --spouse:#a39780; --lav:#c08ec0;
  --doc:#5fc48a; --oral:#e0aa3e; --hyp:#a99be6; --conf:#ec7272; --accent:#e0aa3e;
}}
:root[data-theme="dark"]{
  --bg:#1a1814; --paper:#24211b; --ink:#ece4d4; --muted:#a39780; --rule:#3a352b;
  --shev:#7ea3d6; --stem:#e08a5e; --pior:#86c08e; --spouse:#a39780; --lav:#c08ec0;
  --doc:#5fc48a; --oral:#e0aa3e; --hyp:#a99be6; --conf:#ec7272; --accent:#e0aa3e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:15px/1.5 "PT Sans",system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.card-wrap{max-width:560px;margin:0 auto;padding:18px 18px 44px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.kind{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.controls{display:flex;align-items:center;gap:8px}
.themebtn,.backbtn{
  border:1px solid var(--rule);background:var(--bg);color:var(--ink);
  border-radius:16px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12px;
  text-decoration:none;white-space:nowrap;
}
h1.pname{font:700 26px/1.15 "PT Serif",Georgia,serif;margin:0 0 4px}
.alt{color:var(--muted);font-style:italic;font-family:"PT Serif",Georgia,serif;margin-bottom:4px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:5px 10px;margin:14px 0 18px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
h2.sec{
  font:700 12.5px/1.2 "PT Sans",sans-serif;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);
  margin:22px 0 9px;border-bottom:1px solid var(--rule);padding-bottom:4px;
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-block;border:1px solid var(--rule);border-radius:16px;
  padding:4px 12px;font-size:13.5px;background:var(--bg);color:var(--ink);
  text-decoration:none;line-height:1.35;
}
.chip:hover{border-color:var(--accent);text-decoration:none}
.fact{display:flex;gap:10px;margin:10px 0;font-size:14.5px;align-items:flex-start}
.badge{
  flex:none;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;padding:2px 7px;border-radius:4px;
  margin-top:3px;color:#fff;background:var(--b);white-space:nowrap;
}
.srcref{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
@media (max-width:420px){
  .card-wrap{padding:14px 14px 36px}
  h1.pname{font-size:23px}
  .kv{grid-template-columns:76px 1fr;font-size:14px}
  .fact{gap:8px;font-size:14px}
}

body{background:var(--bg)}
.hero{margin:0 -18px 0;position:relative}
.hero img{display:block;width:100%;height:auto;max-height:230px;object-fit:cover;object-position:50% 40%;
  -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero img{filter:brightness(.72) contrast(.95)}}
:root[data-theme="dark"] .hero img{filter:brightness(.72) contrast(.95)}
.clan{font:400 clamp(30px,9vw,44px)/1.05 Pochaevsk,"PT Serif",Georgia,serif;text-align:center;margin:-6px 0 4px;text-wrap:balance}
.rule{height:10px;margin:8px auto 14px;max-width:220px;border:0;
  background:radial-gradient(circle at 50% 50%,var(--accent) 0 3px,transparent 4px) center/10px 10px no-repeat,
  linear-gradient(90deg,transparent,var(--rule) 20%,var(--rule) 80%,transparent) center/100% 1px no-repeat}
.lead{font:italic 400 21px/1.2 "PT Serif",Georgia,serif;text-align:center;margin:0 0 14px;color:var(--ink)}
.numform{display:flex;gap:10px;justify-content:center;align-items:stretch;margin:0 auto;max-width:340px}
.numform input{flex:1 1 auto;min-width:0;width:100%;text-align:center;font:700 26px/1 "PT Serif",Georgia,serif;
  padding:12px 10px;border:1.5px solid var(--rule);border-radius:12px;background:var(--bg);color:var(--ink);
  font-variant-numeric:tabular-nums}
.numform input:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.numform input[aria-invalid="true"]{border-color:var(--conf)}
.numform button{flex:none;border:0;border-radius:12px;padding:0 20px;font:700 16px "PT Sans",sans-serif;
  background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .numform button{color:#1a1814}}
:root[data-theme="dark"] .numform button{color:#1a1814}
.numform button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{color:var(--conf);font-weight:700;text-align:center;margin:12px 0 0}
.hint{color:var(--muted);text-align:center;font-size:13.5px;margin:16px auto 0;max-width:34ch}
@media (max-width:420px){.hero{margin:0 -14px}}
body{overflow-x:hidden}
</style>
<script>
(function(){
  try{var t=localStorage.getItem("sh.theme");if(t)document.documentElement.dataset.theme=t;}catch(_){}
})();
function toggleTheme(){
  var r=document.documentElement,d=matchMedia("(prefers-color-scheme:dark)").matches;
  var cur=r.dataset.theme||(d?"dark":"light");
  r.dataset.theme=cur==="dark"?"light":"dark";
  try{localStorage.setItem("sh.theme",r.dataset.theme);}catch(_){}
}
</script>
</head>
<body>
<main class="card-wrap">
  <div class="topbar">
    <div class="kind" style="color:var(--accent)">Семейное древо</div>
    <div class="controls">
      <button class="themebtn" type="button" onclick="toggleTheme()" aria-label="Сменить тему">◐</button>
    </div>
  </div>
  <figure class="hero"><img src="assets/header.jpg" alt="Акварельный дуб, в дымке старый город и деревня" width="1400" height="365"></figure>
  <h1 class="clan">Род Шевелевичей-Тихоновичей</h1>
  <hr class="rule">
  <p class="lead">Введи номер предка</p>
  <form class="numform" id="f" novalidate>
    <label for="n" style="position:absolute;left:-9999px">Номер предка</label>
    <input id="n" name="n" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="№" aria-describedby="err">
    <button type="submit">Открыть</button>
  </form>
  <p class="err" id="err" role="alert" hidden>Введи верный номер! Сверься с деревом!</p>
  <p class="hint">Номер стоит красным числом в углу карточки предка на дереве.</p>
</main>
<script>
(function(){
  var MAP={"23":"felician","24":"kondratovich","25":"carl","26":"zelmer","27":"bartholomew","28":"pechoro","29":"stankevich_n","30":"kmitto","15":"matvey","16":"stembrich","17":"ivan_pior","18":"stankevich_f","7":"robert","8":"klementina","9":"vasiliy_r","10":"evfrosiniya_r","3":"vladimir","4":"valentina","1":"valeriy","31":"davyd_t","32":"elena_f","19":"ananiy_t","20":"evdokia_n","11":"maksim_t","12":"pelageya_e","5":"mikhail_t","37":"petr_c","36":"aleksey_c","34":"leon_p","35":"maria_b","33":"filimon_p","2":"galina","6":"lyudmila_n","13":"nikifor_d","14":"marfa_m","22":"maksim_dz","21":"gerasim_d"};
  var f=document.getElementById("f"),n=document.getElementById("n"),err=document.getElementById("err");
  function fail(){err.hidden=false;n.setAttribute("aria-invalid","true");n.focus();n.select();}
  f.addEventListener("submit",function(e){
    e.preventDefault();
    var v=n.value.trim();
    if(!/^[0-9]{1,3}$/.test(v)){fail();return;}
    var k=String(parseInt(v,10));
    if(!Object.prototype.hasOwnProperty.call(MAP,k)){fail();return;}
    err.hidden=true;n.removeAttribute("aria-invalid");
    location.href="p/"+encodeURIComponent(MAP[k])+".html";
  });
  n.addEventListener("input",function(){err.hidden=true;n.removeAttribute("aria-invalid");});
})();
</script>
</body>
</html>
